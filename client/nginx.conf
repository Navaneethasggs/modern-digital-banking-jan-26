server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Handle React routing, return index.html for any request not found
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api requests to the FastAPI backend running in another container
    location /api/ {
        # Rewrite the /api part out before passing it to the server node
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
