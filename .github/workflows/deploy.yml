name: Deploy to AWS EC2

on:
  push:
    branches:
      - main-group-D-new
      - Group-D-feature/AWS-deployement-ameen # Trigger on push to this branch for testing
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to the target directory (or clone if it doesn't exist)
            if [ ! -d "modern-digital-banking-jan-26" ]; then
              git clone https://github.com/your-username/modern-digital-banking-jan-26.git
            fi
            
            cd modern-digital-banking-jan-26
            
            # Fetch and pull the latest changes
            git fetch origin
            git checkout Group-D-feature/AWS-deployement-ameen
            git pull origin Group-D-feature/AWS-deployement-ameen
            
            # Export secrets as environment variables before building/running
            export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
            
            # Build and restart containers using Docker Compose
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d
            
            # Run database migrations
            docker compose -f docker-compose.prod.yml exec -T server alembic upgrade head
            
            # Cleanup unused docker images to save space
            docker system prune -af
